site_name: DASMixer Guide

theme:
  name: material
  favicon: img/favicon.ico
  features:
    - navigation.footer
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Core Concepts & Formulas: concepts.md
    - LFQ Methods: lfq.md
  - User Guide:
    - Project & Samples: user/project_sample.md
    - Processing Identifications: user/peptides_tab.md
    - Viewing Identification Data: user/peptides_table.md
    - Working with Proteins: user/proteins_tab.md
    - Reports: user/reports.md
    - Saved Plots: user/plots_tab.md
    - Data Export & Project Merge: user/export_tab.md
    - Configuration & Plugins: user/configuration.md
    - System Menus (File & Options): user/system_menus.md
    - Advanced Topics:
      - MaxQuant Project Import: user/advanced/MaxQuant.md
      - PRIDE Dataset Import: user/advanced/pride_import.md
      - PTM Configuration: user/advanced/ptm_configuration.md
      - Absolute Concentrations: user/advanced/abs_concentrations.md
      - Command-Line Interface (CLI): user/advanced/cli.md
  - Developer Guide:
    - API & Architecture:
      - Modules & Architecture: developer/architecture.md
      - Core Library API: developer/core_api.md
      - Project File Structure: developer/project_structure.md
    - Examples:
      - Running an Automated Pipeline: developer/example_pipeline.md
      - Generating Spectrum Plots: developer/example_plots.md
    - Plugin Development:
      - Custom Identification Importers: developer/custom_importers.md
      - Custom Reports: developer/custom_reports.md
  - Roadmap: roadmap.md

markdown_extensions:
  - mdx_truly_sane_lists:
      nested_indent: 2
  - pymdownx.arithmatex:
      generic: true
  - toc:
      toc_depth: 3
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - glightbox

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
